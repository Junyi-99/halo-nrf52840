# Matter over Thread colour-temperature light (XIAO nRF52840, Adafruit UF2 bootloader)
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="ScreenBar Halo"
CONFIG_CHIP_DEVICE_VENDOR_NAME="halo-nrf52840"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/halo_light.zap"
# 0x8005 = example lighting-app product id, test vendor 0xFFF1 (uncertified, Apple Home allows it)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_STD_CPP17=y

# Pairing: start BLE commissioning at boot, 1 h window. Test setup code 20202021,
# discriminator 0xF00 (printed on the console at boot).
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60
CONFIG_BT_DEVICE_NAME="HaloLight"

# No MCUboot on this board (Adafruit UF2 bootloader), so no OTA/DFU and no factory data partition.
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_CHIP_FACTORY_DATA_NONE=y

# Board: LEDs through the DK library (XIAO has three, no buttons), no PWM light.
CONFIG_DK_LIBRARY=y
CONFIG_PWM=n

# USB CDC ACM console + shell (the XIAO has no UART to the host)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_PRODUCT="halo-matter"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# MPSL timeslots for the Halo radio bursts
CONFIG_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_ENTROPY_GENERATOR=y

# No NFC tag on the XIAO: do not share the onboarding payload over NFC
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
