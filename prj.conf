# USB CDC ACM serial console (works on DK, dongle, XIAO BLE, nice!nano, Feather, ...)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_PRODUCT="halo-nrf52840"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Quiet console: no banner, no logging; the host tool parses replies line by line.
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_PRINTK=y

CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_MAIN_STACK_SIZE=4096

# The RADIO peripheral is driven directly; make sure nothing else owns it.
CONFIG_BT=n
CONFIG_IEEE802154=n
CONFIG_REBOOT=y
